<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            background-color: #05050a;
            background-image:
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #e0e6ed;
            font-size: 18px;
            padding-bottom: 50px;
            position: relative;
            overflow-x: hidden;
        }

              body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        header {
            max-width: 1100px;
            margin: 30px auto 20px;
            padding: 20px 30px;
            background: rgba(10, 14, 23, 0.85);
            border: 1px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1);
            position: relative;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            color: #00f3ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
        }

        header p {
            font-size: 18px;
            color: #ff0055;
            margin-top: 5px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .content {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 30px;
        }

        .card {
            background: rgba(13, 17, 28, 0.9);
            border: 1px solid #ff0055;
            padding: 25px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }

        .card:nth-child(2) {
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: #ff0055;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 0, 85, 0.4);
            padding-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.5);
        }

        .card:nth-child(2) h2 {
            color: #00f3ff;
            border-bottom-color: rgba(0, 243, 255, 0.4);
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 16px;
            font-weight: 700;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(5, 7, 15, 0.8);
            border: 1px solid #00f3ff;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 8px rgba(0, 243, 255, 0.2);
        }

        input::placeholder {
            color: #4a5568;
        }

        input:focus, select:focus {
            border-color: #ff0055;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5), inset 0 0 10px rgba(255, 0, 85, 0.3);
            background: #090d16;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            background: transparent;
            border: 1px solid;
            position: relative;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .save {
            color: #00ff66;
            border-color: #00ff66;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.3);
        }
        .save:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.8);
        }

        .update {
            color: #00f3ff;
            border-color: #00f3ff;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
        }
        .update:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.8);
        }

        .delete {
            color: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.3);
        }
        .delete:hover {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
        }

        .consult {
            color: #ffcc00;
            border-color: #ffcc00;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.3);
        }
        .consult:hover {
            background: #ffcc00;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
        }

        .clear {
            grid-column: span 2;
            color: #a0aec0;
            border-color: #4a5568;
        }
        .clear:hover {
            background: #4a5568;
            color: #fff;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .total {
            background: rgba(0, 243, 255, 0.1);
            color: #00f3ff;
            border: 1px solid #00f3ff;
            padding: 4px 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
        }

        #list-product {
            list-style: none;
        }

        #list-product li {
            padding: 14px 18px;
            margin-bottom: 12px;
            background: rgba(5, 7, 15, 0.7);
            border: 1px solid #ff0055;
            border-left: 5px solid #00f3ff;
            font-size: 20px;
            font-weight: 600;
            color: #e0e6ed;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        #list-product li:hover {
            transform: translateX(5px);
            background: rgba(0, 243, 255, 0.15);
            border-color: #00f3ff;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
            color: #ffffff;
        }

        @media (max-width: 800px) {
            .content { grid-template-columns: 1fr; }
            header h1 { font-size: 26px; }
        }
    </style>
</head>

<body>

<header>
    <h1>Product Manager</h1>
    <p>System Inventory & Data Control</p>
</header>

<main>
    <div class="content">

        <section class="card">
            <h2>New Product</h2>

            <div class="form-group">
                <label for="id">ID (Search / Edit)</label>
                <input type="text" id="id" placeholder="Auto-generated on save">
            </div>

            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" id="name">
            </div>

            <div class="form-group">
                <label for="price">Price ($)</label>
                <input type="number" step="0.01" id="price">
            </div>

            <div class="form-group">
                <label for="amount">Quantity</label>
                <input type="number" id="amount">
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status">
                    <option value="Available">Available</option>
                    <option value="Unavailable">Unavailable</option>
                </select>
            </div>

            <div class="buttons">
                <button class="save" onclick="save()">Save</button>
                <button class="update" onclick="update()">Update</button>
                <button class="delete" onclick="deleteProduct()">Delete</button>
                <button class="consult" onclick="loadConsult()">Search</button>
                <button class="clear" onclick="clearFields()">Clear Fields</button>
            </div>
        </section>

        <section class="card">
            <div class="product-header">
                <h2>Product List</h2>
                <p id="total-product" class="total">Total: 0</p>
            </div>

            <ul id="list-product"></ul>
        </section>

    </div>
</main>

<script>
    const BASE_URL = 'http://localhost:8080/Product';

    function getProductFromForm() {
        const name = document.getElementById('name').value;
        const price = document.getElementById('price').value;
        const amount = document.getElementById('amount').value;
        const status = document.getElementById('status').value;

        return {
            name,
            price: parseFloat(price) || 0,
            amount: parseInt(amount) || 0,
            status
        };
    }

    async function listAll() {
        try {
            const response = await fetch(BASE_URL);
            const products = await response.json();

            const list = document.getElementById('list-product');
            const total = document.getElementById('total-product');

            list.innerHTML = '';
            let validCount = 0;

            products.forEach(product => {
                if (!product) return;
                validCount++;

                const item = document.createElement('li');
                item.textContent = `ID: ${product.id} | Name: ${product.name} | Price: $${product.price} | Qty: ${product.amount} | Status: ${product.status}`;

                item.onclick = () => {
                    document.getElementById('id').value = product.id;
                    document.getElementById('name').value = product.name;
                    document.getElementById('price').value = product.price;
                    document.getElementById('amount').value = product.amount;
                    document.getElementById('status').value = product.status;
                };

                list.appendChild(item);
            });

            total.textContent = `Total: ${validCount}`;
        } catch (error) {
            console.error('Error fetching products:', error);
        }
    }

    async function save() {
        const product = getProductFromForm();

        const response = await fetch(BASE_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(product)
        });

        if (response.ok) {
            clearFields();
            listAll();
        }
    }

    async function update() {
        const id = document.getElementById('id').value;
        if (!id) return;

        const product = getProductFromForm();

        const response = await fetch(`${BASE_URL}/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(product)
        });

        if (response.ok) {
            clearFields();
            listAll();
        }
    }

    async function deleteProduct() {
        const id = document.getElementById('id').value;
        if (!id) return;

        const response = await fetch(`${BASE_URL}/${id}`, {
            method: 'DELETE'
        });

        if (response.ok) {
            clearFields();
            listAll();
        }
    }

    async function loadConsult() {
        const id = document.getElementById('id').value;
        if (!id) return;

        try {
            const response = await fetch(`${BASE_URL}/${id}`);
            if (!response.ok) throw new Error('Product not found');

            const product = await response.json();

            document.getElementById('name').value = product.name;
            document.getElementById('price').value = product.price;
            document.getElementById('amount').value = product.amount;
            document.getElementById('status').value = product.status;
        } catch (error) {
            console.error('Error fetching product:', error);
        }
    }

    function clearFields() {
        document.getElementById('id').value = '';
        document.getElementById('name').value = '';
        document.getElementById('price').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('status').value = 'Available';
    }

    document.addEventListener('DOMContentLoaded', listAll);
</script>

</body>
</html>
